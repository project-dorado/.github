# ==============================================================================
# Reusable Template: Sign & Attest GitHub Release Assets
#
# Usage in repositories across Heretek-Games, Heretek-AI, and project-dorado:
#
# Include this pattern in your release or publish job. It uses the organization-level
# secrets (GPG_PRIVATE_KEY, GPG_PASSPHRASE) automatically available to all repos.
# ==============================================================================

name: Sign & Attest Release Assets Example

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (Insert build/download artifact steps here to produce distribution files)
      # e.g., dist/myapp-linux.tar.gz, dist/myapp-windows.zip, etc.

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS

      - name: Import GPG Key
        if: env.HAS_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
        env:
          HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}

      - name: Sign Checksums (Detached ASCII-armored signature)
        if: env.HAS_GPG == 'true'
        working-directory: dist
        run: |
          gpg --batch --yes --detach-sign --armor SHA256SUMS

      - name: Attest Build Provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            dist/SHA256SUMS
            dist/SHA256SUMS.asc

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
